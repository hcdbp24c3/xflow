name: Build test APK

# Checks a pull request and builds an APK to try on a phone.
# It never publishes anything: no tag, no release, no secrets. The APK is
# signed with the runner's debug key and uses the application id suffix
# ".ci", so it installs next to the released app instead of replacing it.
# Signed releases are made by release.yml.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Errors fail the job. Infos and warnings are printed but do not fail
      # it: master already has some.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test player and feed
        run: flutter test test/features/player test/features/feed

      # Master has tests that fail for reasons unrelated to a given pull
      # request (see the pull request that added this file). They are run and
      # reported, but do not block the APK.
      - name: Test everything (informational)
        continue-on-error: true
        run: flutter test

      - name: Build APK (arm64, release mode, debug-signed)
        env:
          ORG_GRADLE_PROJECT_ciIdSuffix: .ci
        run: >
          flutter build apk --release --target-platform android-arm64
          --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xflow-ci-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
