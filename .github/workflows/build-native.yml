name: Build native APK

# Checks the Kotlin rewrite under native/ and builds an APK to try on a phone.
# It never publishes anything: no tag, no release, no secrets. The APK is
# signed with the runner's debug key and uses the application id suffix
# ".kt", so it installs next to the released app and next to the Flutter
# test build (suffix ".ci").

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dump compile classpath
        run: |
          ./gradlew :app:dumpCompileClasspath --stacktrace
          cp "$ANDROID_HOME/platforms/android-36/android.jar" app/build/classpath-dump/android.jar || true

      - name: Upload compile classpath
        uses: actions/upload-artifact@v4
        with:
          name: compile-classpath
          path: native/app/build/classpath-dump
          retention-days: 3

      - name: Unit tests
        run: ./gradlew :core:test :app:testReleaseUnitTest --stacktrace

      - name: Build APK (arm64, release mode, minified, debug-signed)
        run: ./gradlew :app:assembleRelease -PciIdSuffix=.kt -Pabi=arm64-v8a --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xflow-native-arm64-apk
          path: native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            native/core/build/reports/tests
            native/app/build/reports/tests
          retention-days: 7
